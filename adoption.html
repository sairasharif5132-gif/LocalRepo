<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet Adoption Form</title>
      <link rel="stylesheet" href="adoption.css">
</head>
<body>
     <div class="adoption-container">
     <h1>🐾 Pet Adoption Application</h1>
     <p>Fill in the form below to apply for pet adoption.</p>
    <form id="Adoption Form">
        <label for="Name">Name:</label>
        <input type="Name" id="Name" name="Name" required><br><br>

        <label for="Email">Email:</label>
        <input type="Email" id="Email" name="Email" required><br><br>

        <label for="Phone No">Phone No:</label>
        <input type="text" id="Phone No" name="Phone No" required><br><br>

          <label for="address">Address:</label>
        <textarea type="Address" id="Address" name="Address" required></textarea><br><br>

        <label for="Pet">Select Pet</label>
            <select id="Pet">
                <option value="">Select a pet</option>
                <option value="Tommy">Tommy - Labrador</option>
                <option value="Luna">Luna - Persian Cat</option>
                <option value="Jenny">Jenny - German Shepherd</option>
            </select><br><br>
                 <label for="Reason">Reason for Adoption</label>
                 <textarea id="Reason" id="Reason" name="Reason" required></textarea><br><br>

                 <p id="errorMessage"></p>

                 <button type="submit">
                 Submit Adoption Application
        </button>
     </form>

         <div id="confirmation"></div><br>
          <a href="dashboard.html">Back to Dashboard</a>
     </div>
         <script src="adoption.js"></script>
</body>
</html>
